<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <title>Saimo local</title>
  <style>
    :root{color-scheme:dark;--bg:#101318;--panel:#191e25;--panel2:#202731;--line:#303944;--text:#f4f6f8;--muted:#98a3af;--accent:#67e8d5;--danger:#ff8585}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit} button{color:inherit;cursor:pointer} .top{position:sticky;top:0;z-index:5;background:#101318ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .toolbar{max-width:1440px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:14px}.brand{font-size:17px;font-weight:750;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
    .tabs{display:flex;gap:5px}.tab,.select,.search{border:1px solid var(--line);background:var(--panel);border-radius:9px;color:var(--text);padding:9px 12px}.tab.active{background:var(--accent);border-color:var(--accent);color:#071714;font-weight:700}
    .search{flex:1;min-width:120px;outline:none}.search:focus,.select:focus{border-color:var(--accent)}.select{max-width:145px}
    main{max-width:1440px;margin:auto;padding:24px 22px 70px}.heading{display:flex;justify-content:space-between;align-items:end;margin:2px 0 17px}.heading h2{font-size:21px;margin:0}.subtle{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid #252d36;border-radius:11px;background:var(--panel);transition:transform .16s,border-color .16s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:var(--accent)}
    .poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel2)}.poster-fallback{display:grid;place-items:center;color:#75818e;font-size:12px;text-align:center;padding:12px}.card-meta{padding:10px 11px 12px}.card-title{margin:0 0 3px;font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-sub{font-size:12px;color:var(--muted)}.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.card-badge{padding:2px 7px;border-radius:999px;background:#263c3a;color:var(--accent);font-size:10px;font-weight:700}.card-badge.active{background:#3a3323;color:#ffd47a}.card-badge.queued{background:#29344a;color:#b8d2ff}
    .empty{padding:54px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.more{display:block;margin:22px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 18px}.more:disabled{opacity:.55;cursor:default}
    .download-layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.5fr);gap:26px}.download-layout h3{font-size:15px;margin:0 0 12px}.job-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.job-heading h3{margin:0}.list-actions{display:flex;flex-wrap:wrap;gap:7px}.list-action{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:6px 9px;font-size:11px}.list-action:hover{border-color:var(--accent)}.list-action:disabled{opacity:.5;cursor:wait}.stack{display:flex;flex-direction:column;gap:9px}.job{padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:10px}.job-top{display:flex;justify-content:space-between;gap:12px}.job-name{font-size:13px;font-weight:650;overflow-wrap:anywhere}.job-status{color:var(--muted);font-size:12px;white-space:nowrap}.bar{height:5px;margin-top:10px;background:#303944;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar i.indeterminate{width:28%;animation:bar-progress 1.2s ease-in-out infinite alternate}@keyframes bar-progress{from{transform:translateX(0)}to{transform:translateX(250%)}}.job-error{color:var(--danger)}.job-actions{display:flex;gap:7px;margin-top:10px}.job-action{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:5px 9px;font-size:12px}.job-action:hover{border-color:var(--accent)}.job-action.danger:hover{border-color:var(--danger);color:var(--danger)}.job-action:disabled{opacity:.5;cursor:wait}.file-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.file-table-wrap{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.file-table-wrap h3{padding:12px 14px;margin:0;border-bottom:1px solid var(--line)}.file-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.file-table th,.file-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}.file-table th{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.file-table tr:last-child td{border-bottom:0}.file-table th:last-child,.file-table td:last-child{width:78px;text-align:right;white-space:nowrap}.file-table a{display:block;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-table a:hover{text-decoration:underline}.file-empty{text-align:center!important;color:var(--muted);padding:22px 10px!important}
    .job-metrics{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;color:var(--muted);font-size:12px}.job-metrics strong{color:var(--text);font-weight:600}.download-summary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:24px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.summary-stat{min-width:0}.summary-label{display:block;color:var(--muted);font-size:11px}.summary-value{display:block;margin-top:3px;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    dialog{width:min(850px,calc(100% - 28px));max-height:90vh;overflow:auto;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#050709c9;backdrop-filter:blur(3px)}.modal-content{padding:22px}.modal-content h2{font-size:22px;line-height:1.2;margin:0 34px 6px 0}.modal-desc{color:var(--muted);font-size:13px}.detail-hero{display:grid;grid-template-columns:126px minmax(0,1fr);gap:19px;align-items:start;padding-right:28px}.detail-poster{width:126px;aspect-ratio:2/3;object-fit:cover;border-radius:9px;background:var(--panel2)}.detail-poster[hidden]{display:none}.detail-cast{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.6}.synopsis{font-size:14px;line-height:1.6;color:#d8dee5;margin:15px 0}.detail-section-title{font-size:14px;margin:17px 0 8px}.episode-guide{border-top:1px solid var(--line);padding-top:2px;margin-top:14px}.season-guide{border:1px solid var(--line);border-radius:9px;margin:8px 0;overflow:hidden}.season-guide summary{cursor:pointer;padding:10px 12px;background:var(--panel2);font-size:13px;font-weight:650}.episode-list{padding:4px 12px}.episode-row{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.episode-row:last-child{border-bottom:0}.episode-number{font-weight:700;color:var(--text)}.episode-streams{display:flex;flex-wrap:wrap;gap:5px}.stream-badge{display:inline-flex;padding:2px 7px;border-radius:999px;background:#263c3a;color:var(--accent);font-size:11px}.stream-overview{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.fields{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}.field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.field[hidden]{display:none}.field select,.field input{width:auto;max-width:190px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--text)}.field input[type=radio]{accent-color:var(--accent)}.versions{display:flex;gap:16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.btn{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:9px 14px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#061613;font-weight:750}.close{position:absolute;right:17px;top:14px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:23px}.close:hover{background:var(--panel2);color:var(--text)}
    .notice{color:var(--muted);font-size:13px;margin-top:15px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:min(440px,calc(100% - 32px));padding:12px 16px;border:1px solid #39786f;border-radius:10px;background:#19312e;color:#cafff5;box-shadow:0 8px 28px #0008}.toast[hidden]{display:none}
    .credits{max-width:1440px;margin:0 auto;padding:14px 22px 24px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.credits img{display:block;width:64px;height:auto}.credits a{line-height:0}
    @media(max-width:950px){.download-summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:760px){.toolbar{flex-wrap:wrap;padding:11px 14px;gap:9px}.brand{margin-right:auto}.search{order:3;flex-basis:100%}.select{max-width:none}.grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:11px}main{padding:19px 14px 50px}.download-layout,.file-tables{grid-template-columns:1fr;gap:23px}.download-summary{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px}.credits{padding:14px;font-size:11px}.credits img{width:56px}}
    .detail-hero.without-poster{grid-template-columns:minmax(0,1fr)}
    @media(max-width:480px){.modal-content{padding:17px}.detail-hero{grid-template-columns:82px minmax(0,1fr);gap:13px;padding-right:20px}.detail-hero.without-poster{grid-template-columns:minmax(0,1fr)}.detail-poster{width:82px}.episode-row{grid-template-columns:38px minmax(0,1fr)}}
  </style>
</head>
<body>
  <header class="top"><div class="toolbar">
    <div class="brand">SAIMO LOCAL</div>
    <nav class="tabs" aria-label="Seções">
      <button class="tab active" data-tab="catalog">Catálogo</button>
      <button class="tab" data-tab="downloads">Downloads</button>
    </nav>
    <label class="sr-only" for="search">Buscar título</label><input id="search" class="search" type="search" placeholder="Buscar título…" autocomplete="off">
    <label class="sr-only" for="kind">Tipo</label><select id="kind" class="select"><option value="">Tudo</option><option value="f">Filmes</option><option value="s">Séries</option></select>
  </div></header>
  <main>
    <section id="catalog-section">
      <div class="heading"><div><h2>Catálogo</h2><div id="catalog-count" class="subtle">Carregando catálogo…</div></div></div>
      <div id="grid" class="grid"></div><div id="empty" class="empty" hidden></div>
      <button id="more" class="more" hidden>Carregar mais</button>
    </section>
    <section id="downloads-section" hidden>
      <div class="heading"><div><h2>Downloads</h2><div id="destination" class="subtle"></div></div></div>
      <div class="download-layout"><div><div class="job-heading"><h3>Fila</h3><div class="list-actions"><button id="pause-all" class="list-action" type="button">Pausar tudo</button><button id="resume-all" class="list-action" type="button">Retomar tudo</button><button id="clear-completed" class="list-action" type="button">Limpar completos</button><button id="clear-list" class="list-action" type="button">Limpar lista</button></div></div><div id="jobs" class="stack"></div></div><div class="file-tables">
        <section class="file-table-wrap"><h3>Filmes</h3><table class="file-table"><thead><tr><th>Arquivo</th><th>Tamanho</th></tr></thead><tbody id="movie-files"></tbody></table></section>
        <section class="file-table-wrap"><h3>Séries</h3><table class="file-table"><thead><tr><th>Arquivo</th><th>Tamanho</th></tr></thead><tbody id="series-files"></tbody></table></section>
      </div></div>
      <div id="download-summary" class="download-summary" aria-live="polite"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="details"><button id="close" class="close" aria-label="Fechar">×</button><form id="download-form" class="modal-content">
    <div id="detail-hero" class="detail-hero"><img id="detail-poster" class="detail-poster" alt="" hidden><div><h2 id="detail-title"></h2><div id="detail-meta" class="modal-desc"></div><div id="detail-cast" class="detail-cast" hidden></div></div></div>
    <p id="synopsis" class="synopsis" hidden></p>
    <div id="movie-streams" class="stream-overview" hidden></div>
    <section id="episode-guide" class="episode-guide" hidden><h3 class="detail-section-title">Temporadas, episódios e streams disponíveis</h3><div id="episode-list"></div></section>
    <div id="version-options" class="fields versions"></div><div id="series-options" class="fields" hidden></div>
    <div class="modal-actions"><button id="cancel" class="btn" type="button">Fechar</button><button id="download" class="btn primary" type="submit">Adicionar à fila</button></div>
  </form></dialog>
  <footer class="credits" aria-label="Créditos">
    <a href="https://www.themoviedb.org/" target="_blank" rel="noopener" aria-label="The Movie Database">
      <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_1-5bdc75aaebeb75dc7ae79426ddd9be3b2be1e342510f8202baf6bffa71d7f5c4.svg" alt="TMDB">
    </a>
    <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
  </footer>
  <script>
    const $ = (selector) => document.querySelector(selector);
    let token = localStorage.getItem('saimo-token') || '';
    let page = 0, total = 0, loading = false, queryGeneration = 0, selectedItem = null, searchTimer;
    let refreshingDownloads = false, lastFilesRefresh = 0, destinationLoaded = false;
    const progressSamples = new Map();
    const headers = () => token ? {'x-token': token} : {};
    async function api(url, options = {}) {
      const response = await fetch(url, {...options, headers: {...headers(), ...(options.headers || {})}});
      if (response.status === 401) {
        const value = prompt('Informe o token SAIMO_TOKEN:');
        if (value) { token = value; localStorage.setItem('saimo-token', token); return api(url, options); }
      }
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.detail || `Erro HTTP ${response.status}`);
      return result;
    }
    function message(target, text) { target.textContent = text; }
    let toastTimer;
    function showToast(text) { const toast=$('#toast'); toast.textContent=text; toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toast.hidden=true;},4000); }
    function resetCatalog() { queryGeneration += 1; page = 0; total = 0; $('#grid').replaceChildren(); $('#empty').hidden = true; $('#more').hidden = true; loadPage(); }
    async function loadPage() {
      if (loading || (page > 0 && $('#grid').childElementCount >= total)) return;
      loading = true; const generation = queryGeneration; $('#more').disabled = true; $('#more').textContent = 'Carregando…';
      try {
        const params = new URLSearchParams({q: $('#search').value.trim(), tipo: $('#kind').value, pagina: String(page), limite: '60'});
        const result = await api(`/api/items?${params}`);
        if (generation !== queryGeneration) return;
        total = result.total;
        for (const entry of result.items) renderCard(entry);
        $('#catalog-count').textContent = total ? `${total.toLocaleString('pt-BR')} títulos` : 'Nenhum título encontrado';
        $('#empty').hidden = result.items.length > 0 || page > 0;
        if (!result.items.length && page === 0) {
          message($('#empty'), result.catalogo_sincronizado
            ? 'Nenhum resultado. Tente outro título ou filtro.'
            : 'Catálogo ainda não sincronizado. Execute: python sync_catalog.py --imagens (ou docker compose exec saimo python sync_catalog.py --imagens).');
        }
        page += 1;
        const hasMore = $('#grid').childElementCount < total;
        $('#more').hidden = !hasMore; $('#more').disabled = false; $('#more').textContent = 'Carregar mais';
      } catch (error) { if (generation === queryGeneration) { message($('#empty'), error.message); $('#empty').hidden = false; } }
      finally { loading = false; if (generation !== queryGeneration) loadPage(); }
    }
    function renderCard(item) {
      const card = document.createElement('article'); card.className = 'card'; card.dataset.itemId=String(item.id); card.tabIndex = 0; card.setAttribute('role', 'button');
      const image = document.createElement('img'); image.className = 'poster'; image.loading = 'lazy'; image.alt = `Pôster: ${item.titulo}`;
      if (item.poster) image.src = item.poster; else image.hidden = true;
      image.onerror = () => { image.hidden = true; };
      const meta = document.createElement('div'); meta.className = 'card-meta';
      const title = document.createElement('p'); title.className = 'card-title'; title.textContent = item.titulo;
      const sub = document.createElement('div'); sub.className = 'card-sub'; sub.textContent = item.tipo === 's' ? `Série${item.ano ? ` · ${item.ano}` : ''}` : (item.ano || 'Filme');
      meta.append(title, sub);
      card.append(image, meta);
      updateCardBadges(card,{tipo:item.tipo,baixados:item.baixados,downloads_ativos:item.downloads_ativos,downloads_fila:item.downloads_fila});
      card.addEventListener('click', () => openItem(item.id)); card.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openItem(item.id); } });
      $('#grid').append(card);
    }
    function updateCardBadges(card,status) {
      card.querySelector('.card-badges')?.remove();
      const downloaded=Number(status.baixados)||0,active=Number(status.downloads_ativos)||0,queued=Number(status.downloads_fila)||0;
      if(!downloaded&&!active&&!queued)return;
      const badges=document.createElement('div');badges.className='card-badges';
      if(downloaded){const badge=document.createElement('span');badge.className='card-badge';badge.textContent=status.tipo==='s'?`${downloaded} ${downloaded===1?'episódio baixado':'episódios baixados'}`:'Baixado';badges.append(badge);}
      if(active){const badge=document.createElement('span');badge.className='card-badge active';badge.textContent=active===1?'Baixando':`${active} downloads ativos`;badges.append(badge);}
      if(queued){const badge=document.createElement('span');badge.className='card-badge queued';badge.textContent=queued===1?'Na fila':`${queued} na fila`;badges.append(badge);}
      card.querySelector('.card-meta').append(badges);
    }
    async function refreshCardBadges(ids) {
      if($('#catalog-section').hidden)return;
      const cards=[...document.querySelectorAll('#grid .card')].filter(card=>!ids||ids.includes(Number(card.dataset.itemId)));
      if(!cards.length)return;
      const requested=cards.map(card=>Number(card.dataset.itemId));
      try { for(let offset=0;offset<requested.length;offset+=300){const batch=requested.slice(offset,offset+300);const result=await api(`/api/items/status?ids=${encodeURIComponent(batch.join(','))}`);for(const status of result.items){const card=document.querySelector(`#grid .card[data-item-id="${status.id}"]`);if(card)updateCardBadges(card,status);}} }
      catch(error) { console.warn('Não foi possível atualizar os badges do catálogo:',error); }
    }
    const parseSources = (value) => {
      if (typeof value === 'string') { try { return JSON.parse(value); } catch { return []; } }
      return value;
    };
    const versionLabel = (version) => version === 'dub' ? 'Dublado' : version === 'leg' ? 'Legendado' : version;
    function episodeSources(episode) {
      const sources = parseSources(episode.fontes);
      if (Array.isArray(sources)) return sources;
      return Array.isArray(sources?.[episode.versao]) ? sources[episode.versao] : [];
    }
    function providerName(source) {
      try {
        const host = new URL(source).hostname.toLowerCase().replace(/^www\./, '');
        if (host.includes('saimo-tv.pages.dev')) return 'Saimo';
        if (host.includes('dbonline')) return 'DBOnline';
        return host;
      } catch { return 'Fonte'; }
    }
    function renderEpisodeGuide(episodes) {
      const guide = $('#episode-guide'), list = $('#episode-list');
      list.replaceChildren();
      const seasons = new Map();
      for (const episode of episodes || []) {
        const sources = episodeSources(episode);
        if (!sources.length) continue;
        const seasonNumber = Number(episode.temp), episodeNumber = Number(episode.ep);
        if (!Number.isFinite(seasonNumber) || !Number.isFinite(episodeNumber)) continue;
        if (!seasons.has(seasonNumber)) seasons.set(seasonNumber, new Map());
        const season = seasons.get(seasonNumber);
        if (!season.has(episodeNumber)) season.set(episodeNumber, new Map());
        season.get(episodeNumber).set(episode.versao, [...new Set(sources.map(providerName))]);
      }
      const seasonNumbers = [...seasons.keys()].sort((a,b) => a-b);
      guide.hidden = !seasonNumbers.length;
      for (const [seasonIndex, seasonNumber] of seasonNumbers.entries()) {
        const seasonEpisodes = seasons.get(seasonNumber);
        const details = document.createElement('details'); details.className = 'season-guide'; details.open = seasonIndex === 0;
        const summary = document.createElement('summary');
        const availableVersions = [...new Set([...seasonEpisodes.values()].flatMap(ep => [...ep.keys()]))].map(versionLabel);
        summary.textContent = `Temporada ${seasonNumber} · ${seasonEpisodes.size} episódios · ${availableVersions.join(' / ')}`;
        const episodeList = document.createElement('div'); episodeList.className = 'episode-list';
        for (const [episodeNumber, versions] of [...seasonEpisodes.entries()].sort((a,b) => a[0]-b[0])) {
          const row = document.createElement('div'); row.className = 'episode-row';
          const number = document.createElement('span'); number.className = 'episode-number'; number.textContent = `E${String(episodeNumber).padStart(2, '0')}`;
          const streams = document.createElement('div'); streams.className = 'episode-streams';
          for (const [version, providers] of versions) {
            const badge = document.createElement('span'); badge.className = 'stream-badge';
            badge.textContent = `${versionLabel(version)} · ${providers.join(', ')}`; streams.append(badge);
          }
          row.append(number, streams); episodeList.append(row);
        }
        details.append(summary, episodeList); list.append(details);
      }
    }
    function renderMovieStreams(fontes) {
      const box = $('#movie-streams'); box.replaceChildren();
      const versions = Object.entries(fontes || {}).filter(([, sources]) => Array.isArray(sources) && sources.length);
      box.hidden = !versions.length;
      for (const [version, sources] of versions) {
        const badge = document.createElement('span'); badge.className = 'stream-badge';
        badge.textContent = `${versionLabel(version)} · ${[...new Set(sources.map(providerName))].join(', ')}`;
        box.append(badge);
      }
    }
    async function openItem(id) {
      try {
        selectedItem = await api(`/api/item/${id}`);
        $('#detail-title').textContent = selectedItem.titulo + (selectedItem.ano ? ` (${selectedItem.ano})` : '');
        $('#detail-meta').textContent = [selectedItem.tipo === 's' ? 'Série' : 'Filme', selectedItem.generos ? `Gêneros: ${selectedItem.generos}` : ''].filter(Boolean).join(' · ');
        const poster = $('#detail-poster'); poster.hidden = !selectedItem.poster;
        $('#detail-hero').classList.toggle('without-poster', !selectedItem.poster);
        if (selectedItem.poster) { poster.src = selectedItem.poster; poster.alt = `Pôster de ${selectedItem.titulo}`; }
        poster.onerror = () => { poster.hidden = true; $('#detail-hero').classList.add('without-poster'); };
        const cast = Array.isArray(selectedItem.atores) ? selectedItem.atores : [];
        $('#detail-cast').textContent = cast.length ? `Elenco: ${cast.join(', ')}` : '';
        $('#detail-cast').hidden = !cast.length;
        $('#synopsis').textContent = selectedItem.sinopse || ''; $('#synopsis').hidden = !selectedItem.sinopse;
        renderMovieStreams(selectedItem.fontes || {});
        renderEpisodeGuide(selectedItem.episodios || []);
        const versions = Object.entries(selectedItem.fontes || {}).filter(([, sources]) => Array.isArray(sources) && sources.length).map(([version]) => version);
        if (selectedItem.tipo === 's') {
          for (const episode of selectedItem.episodios || []) {
            if (episodeSources(episode).length && !versions.includes(episode.versao)) versions.push(episode.versao);
          }
        }
        const versionBox = $('#version-options'); versionBox.replaceChildren();
        for (const version of versions) {
          const label = document.createElement('label'); label.className = 'field';
          const radio = document.createElement('input'); radio.type = 'radio'; radio.name = 'version'; radio.value = version; radio.required = true; radio.checked = version === versions[0];
          label.append(radio, document.createTextNode(versionLabel(version))); versionBox.append(label);
        }
        if (!versions.length) { const note = document.createElement('span'); note.className = 'subtle'; note.textContent = 'Nenhuma versão disponível.'; versionBox.append(note); }
        const seriesBox = $('#series-options'); seriesBox.replaceChildren(); seriesBox.hidden = selectedItem.tipo !== 's';
        if (selectedItem.tipo === 's') {
          const scopeLabel = document.createElement('label'); scopeLabel.className = 'field'; scopeLabel.append(document.createTextNode('Baixar'));
          const scope = document.createElement('select'); scope.id = 'download-scope';
          for (const [value, text] of [['episodios', 'Episódios selecionados'], ['temporada', 'Temporada completa'], ['serie', 'Série completa']]) { const option = document.createElement('option'); option.value = value; option.textContent = text; scope.append(option); }
          scopeLabel.append(scope);
          const seasonLabel = document.createElement('label'); seasonLabel.className = 'field'; seasonLabel.id = 'season-field'; seasonLabel.append(document.createTextNode('Temporada'));
          const season = document.createElement('select'); season.id = 'season';
          const episodeHasVersion = (episode, version) => episode.versao === version && episodeSources(episode).length > 0;
          const refreshSeasons = () => {
            const version = document.querySelector('input[name="version"]:checked')?.value;
            const previous = season.value;
            const seasons = [...new Set((selectedItem.episodios || []).filter(ep => episodeHasVersion(ep, version)).map(ep => Number(ep.temp)))].sort((a,b) => a-b);
            season.replaceChildren();
            for (const number of seasons) { const option = document.createElement('option'); option.value = number; option.textContent = `Temporada ${number}`; season.append(option); }
            if (seasons.includes(Number(previous))) season.value = previous;
          };
          versionBox.querySelectorAll('input[name="version"]').forEach(radio => radio.addEventListener('change', refreshSeasons));
          refreshSeasons();
          seasonLabel.append(season);
          const episodeLabel = document.createElement('label'); episodeLabel.className = 'field'; episodeLabel.id = 'episode-field'; episodeLabel.append(document.createTextNode('Episódios'));
          const episodeInput = document.createElement('input'); episodeInput.id = 'episodes'; episodeInput.value = 'primeiro'; episodeInput.placeholder = '1-3,5 ou todos'; episodeInput.setAttribute('aria-label', 'Episódios a baixar');
          episodeLabel.append(episodeInput);
          const updateScopeFields = () => { seasonLabel.hidden = scope.value === 'serie'; episodeLabel.hidden = scope.value !== 'episodios'; };
          scope.addEventListener('change', updateScopeFields); updateScopeFields();
          seriesBox.append(scopeLabel, seasonLabel, episodeLabel);
        }
        $('#download').disabled = !versions.length; $('#details').showModal();
      } catch (error) { alert(error.message); }
    }
    $('#download-form').addEventListener('submit', async (event) => {
      event.preventDefault(); if (!selectedItem) return;
      const version = document.querySelector('input[name="version"]:checked')?.value;
      if (!version) return;
      const body = {item_id: selectedItem.id, versao: version};
      if (selectedItem.tipo === 's') { body.alcance = $('#download-scope').value; if (body.alcance !== 'serie') body.temporada = Number($('#season').value); if (body.alcance === 'episodios') body.episodios = $('#episodes').value.trim() || 'primeiro'; }
      $('#download').disabled = true;
      try { await api('/api/download', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)}); $('#details').close(); showToast('Mídia adicionada à fila de downloads corretamente.'); refreshCardBadges([Number(selectedItem.id)]); }
      catch (error) { alert(error.message); }
      finally { $('#download').disabled = false; }
    });
    function showTab(name) {
      const returningToCatalog=!$('#downloads-section').hidden&&name==='catalog';
      const downloads = name === 'downloads'; $('#catalog-section').hidden = downloads; $('#downloads-section').hidden = !downloads;
      document.querySelectorAll('.tab').forEach(button => button.classList.toggle('active', button.dataset.tab === name));
      if (downloads) refreshDownloads();
      else if(returningToCatalog) resetCatalog();
    }
    function formatSpeed(bytesPerSecond) {
      if (!Number.isFinite(bytesPerSecond) || bytesPerSecond <= 0) return '0 B/s';
      const units=['B/s','KB/s','MB/s','GB/s'];let value=bytesPerSecond,index=0;
      while(value>=1024&&index<units.length-1){value/=1024;index++;}
      return `${value.toFixed(index?1:0)} ${units[index]}`;
    }
    function formatBytes(bytes) {
      const units=['B','KB','MB','GB','TB'];let value=Math.max(0,Number(bytes)||0),index=0;
      while(value>=1024&&index<units.length-1){value/=1024;index++;}
      return `${value.toFixed(index?1:0)} ${units[index]}`;
    }
    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '—';
      seconds=Math.ceil(seconds);
      if(seconds<60)return `${seconds} s`;
      const minutes=Math.ceil(seconds/60);if(minutes<60)return `${minutes} min`;
      const hours=Math.floor(minutes/60),remaining=minutes%60;
      if(hours<48)return remaining?`${hours} h ${remaining} min`:`${hours} h`;
      return `${Math.floor(hours/24)} d ${hours%24} h`;
    }
    function measureJob(job, now) {
      const id=Number(job.id),bytes=Number(job.bytes_done)||0,pct=Number(job.pct)||0;
      const previous=progressSamples.get(id);let speed=0,pctRate=0;
      if(previous&&now>previous.time){const elapsed=(now-previous.time)/1000;speed=Math.max(0,(bytes-previous.bytes)/elapsed);pctRate=Math.max(0,(pct-previous.pct)/elapsed);}
      const active=['resolvendo','baixando','pausando','cancelando'].includes(job.status);
      if(active)progressSamples.set(id,{time:now,bytes,pct});else progressSamples.delete(id);
      let eta='—';
      if(job.status==='baixando'){
        const total=Number(job.bytes_total)||0;
        if(total>0&&speed>0)eta=formatDuration(Math.max(0,total-bytes)/speed);
        else if(pctRate>0)eta=formatDuration(Math.max(0,100-pct)/pctRate);
        else eta='calculando…';
      }else if(job.status==='resolvendo')eta='resolvendo fonte…';
      else if(job.status==='fila')eta='aguardando';
      else if(job.status==='pausado'||job.status==='pausando')eta='pausado';
      else if(job.status==='concluido')eta='concluído';
      return {speed:job.status==='baixando'?speed:0,eta};
    }
    function renderSummary(counts, totalSpeed) {
      const count=(...statuses)=>statuses.reduce((sum,status)=>sum+(Number(counts[status])||0),0);
      const values=[
        ['Velocidade total',formatSpeed(totalSpeed)],
        ['Ativos',count('resolvendo','baixando','pausando','cancelando')],
        ['Na fila',count('fila')],
        ['Pausados',count('pausado')],
        ['Concluídos',count('concluido')],
        ['Com erro',count('erro')],
        ['Cancelados',count('cancelado')]
      ];
      const summary=$('#download-summary');summary.replaceChildren();
      for(const [label,value] of values){const stat=document.createElement('div');stat.className='summary-stat';const name=document.createElement('span');name.className='summary-label';name.textContent=label;const amount=document.createElement('span');amount.className='summary-value';amount.textContent=value;stat.append(name,amount);summary.append(stat);}
    }
    async function refreshDownloads() {
      if (refreshingDownloads) return;
      refreshingDownloads = true;
      try {
        const jobData = await api('/api/jobs');
        const now = Date.now();
        const tasks = [];
        if (!destinationLoaded) tasks.push(api('/api/config').then(config => { $('#destination').textContent = `Pasta: ${config.pasta}`; destinationLoaded = true; }));
        if (!lastFilesRefresh || now - lastFilesRefresh > 15000) tasks.push(api('/api/arquivos').then(data => { renderFiles(data.arquivos); lastFilesRefresh = Date.now(); }));
        await Promise.all(tasks);
        const jobs = $('#jobs'); jobs.replaceChildren();
        let totalSpeed=0;const jobMetrics=new Map();
        for(const job of jobData.jobs){const metric=measureJob(job,now);jobMetrics.set(Number(job.id),metric);totalSpeed+=metric.speed;}
        renderSummary(jobData.counts||{},totalSpeed);
        if (!jobData.jobs.length) { const empty = document.createElement('div'); empty.className='empty'; empty.textContent='A fila está vazia.'; jobs.append(empty); }
        for (const job of jobData.jobs) {
          const card = document.createElement('div'); card.className='job';
          const top=document.createElement('div');top.className='job-top';const name=document.createElement('div');name.className='job-name';name.textContent=job.titulo;const status=document.createElement('div');status.className='job-status';status.textContent=job.erro ? `Erro: ${job.erro}` : job.status; if(job.status==='erro') status.classList.add('job-error');top.append(name,status);
          const percent=Math.max(0,Math.min(100,Number(job.pct)||0));const metric=jobMetrics.get(Number(job.id));
          const bytesDone=Number(job.bytes_done)||0,bytesTotal=Number(job.bytes_total)||0;
          const unknownProgress=job.status==='baixando'&&bytesTotal===0&&percent===0;
          const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('i');if(unknownProgress)fill.classList.add('indeterminate');else fill.style.width=`${percent}%`;bar.append(fill);
          const details=document.createElement('div');details.className='job-metrics';
          const metricText=job.status==='baixando'?(metric.speed?formatSpeed(metric.speed):'calculando…'):'—';
          const progressText=unknownProgress?`Transferido: ${formatBytes(bytesDone)}`:`${percent.toFixed(1)}% baixado`;
          for(const text of [progressText,`Velocidade: ${metricText}`,`Término: ${metric.eta}`]){const part=document.createElement('span');part.textContent=text;details.append(part);}
          card.append(top,bar,details);
          const actions=document.createElement('div');actions.className='job-actions';
          const addAction=(label,action,danger=false)=>{const button=document.createElement('button');button.type='button';button.className=`job-action${danger?' danger':''}`;button.textContent=label;button.addEventListener('click',async()=>{button.disabled=true;try{await api(`/api/jobs/${job.id}/${action}`,{method:'POST'});await refreshDownloads();}catch(error){alert(error.message);button.disabled=false;}});actions.append(button);};
          if(['fila','resolvendo','baixando'].includes(job.status)) addAction('Pausar','pause');
          if(job.status==='pausado') addAction('Retomar','resume');
          if(['fila','resolvendo','baixando','pausando','pausado','cancelando'].includes(job.status)) addAction('Cancelar e apagar dados','cancel',true);
          if(actions.childElementCount) card.append(actions);jobs.append(card);
        }
      } catch(error) { $('#destination').textContent=error.message; }
      finally { refreshingDownloads = false; }
    }
    async function clearJobs(scope, button) {
      if(scope==='list'&&!confirm('Limpar a lista? Downloads ativos serão mantidos. Os jobs na fila e pausados serão removidos e o progresso parcial descartado. Arquivos completos no disco não serão apagados.'))return;
      button.disabled=true;
      try {
        const result=await api('/api/jobs/clear',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scope})});
        await refreshDownloads();
        if(scope==='list'&&result.ativos_preservados)alert(`${result.limpos} itens limpos da lista. ${result.ativos_preservados} downloads ativos foram mantidos.`);
        else if(!result.limpos)alert(scope==='completed'?'Não há downloads completos para limpar.':'A lista já está limpa.');
      }catch(error){alert(error.message);}
      finally{button.disabled=false;}
    }
    async function bulkJobAction(action,button) {
      button.disabled=true;
      try {
        const result=await api(`/api/jobs/${action}`,{method:'POST'});
        await refreshDownloads();
        if(action==='pause-all')showToast(result.pausando?`Pausa solicitada para ${result.pausando} download(s); os demais foram pausados.`:`${result.pausados} download(s) pausado(s).`);
        else showToast(result.erros?`${result.retomados} download(s) retomado(s); ${result.erros} não puderam ser retomados.`:`${result.retomados} download(s) retomado(s).`);
      } catch(error) { alert(error.message); }
      finally { button.disabled=false; }
    }
    function renderFiles(entries) {
      const renderTable = (selector, folder) => {
        const body=$(selector);body.replaceChildren();
        const files=entries.filter(file=>file.nome.startsWith(`${folder}/`));
        if (!files.length) { const row=document.createElement('tr');const empty=document.createElement('td');empty.className='file-empty';empty.colSpan=2;empty.textContent='Nenhum arquivo nesta pasta.';row.append(empty);body.append(row);return; }
        for(const file of files){const row=document.createElement('tr');const name=document.createElement('td');const link=document.createElement('a');link.href=file.url;link.target='_blank';link.rel='noopener';link.title=file.nome;link.textContent=file.nome.slice(folder.length+1);name.append(link);const size=document.createElement('td');size.textContent=`${(file.tamanho/1048576).toFixed(1)} MB`;row.append(name,size);body.append(row);}
      };
      renderTable('#movie-files','movies');renderTable('#series-files','series');
    }
    document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => showTab(button.dataset.tab)));
    $('#clear-completed').addEventListener('click',event=>clearJobs('completed',event.currentTarget));
    $('#clear-list').addEventListener('click',event=>clearJobs('list',event.currentTarget));
    $('#pause-all').addEventListener('click',event=>bulkJobAction('pause-all',event.currentTarget));
    $('#resume-all').addEventListener('click',event=>bulkJobAction('resume-all',event.currentTarget));
    $('#kind').addEventListener('change', resetCatalog); $('#more').addEventListener('click', loadPage);
    $('#search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer=setTimeout(resetCatalog,300); });
    $('#close').addEventListener('click', () => $('#details').close()); $('#cancel').addEventListener('click', () => $('#details').close());
    window.addEventListener('scroll', () => { if (!$('#catalog-section').hidden && window.innerHeight + window.scrollY >= document.body.offsetHeight - 650) loadPage(); });
    loadPage(); setInterval(() => { if (!$('#downloads-section').hidden) refreshDownloads(); }, 2500); setInterval(() => refreshCardBadges(), 5000);
  </script>
</body>
